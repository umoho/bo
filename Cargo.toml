[package]
name = "bo"
version = "0.2.0"
edition = "2024"
description = "Audio editing and mixing for agents — one command per edit, audition or render; the spine of a future CLI DAW"
keywords = ["audio", "daw", "cli", "agent", "mixer"]
categories = ["command-line-interface", "multimedia::audio"]
license = "BSD-3-Clause"
repository = "https://github.com/umoho/bo"

[workspace]
members = ["core", "engine"]

[dependencies]
bo-core = { path = "core" }
bo-engine = { path = "engine" }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde_json = "1"
shlex = "2.0.1"

[dev-dependencies]
hound = "3.5"
rodio = { version = "0.22.2", features = ["wav_output"] }
tempfile = "3"
