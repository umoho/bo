[package]
name = "bo"
version = "0.1.0"
edition = "2024"
description = "Arrange and play a radio program with commands — a player whose arrangement is data"
license = "BSD-3-Clause"
repository = "https://github.com/umoho/bo"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
rodio = { version = "0.22.2", features = ["wav_output"] }
shlex = "2.0.1"
