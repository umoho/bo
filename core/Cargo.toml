[package]
name = "bo-core"
version = "0.1.0"
edition = "2024"
description = "The spine of bo — the data model and engine both the daemon and the client are built on"
keywords = ["audio", "daw", "cli", "agent", "mixer"]
categories = ["command-line-interface", "multimedia::audio"]
license = "BSD-3-Clause"

[dependencies]
hound = "3.5"
rodio = { version = "0.22.2", features = ["wav_output"] }
serde_json = "1"
tempfile = "3"
