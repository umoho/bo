[package]
name = "bo-engine"
version = "0.1.0"
edition = "2024"
description = "bo's engine — the actual execution on top of the data model: transport, backends, playback and render"
keywords = ["audio", "daw", "cli", "agent", "mixer"]
categories = ["command-line-interface", "multimedia::audio"]
license = "BSD-3-Clause"

[dependencies]
bo-core = { path = "../core" }
hound = "3.5"
rodio = { version = "0.22.2", features = ["wav_output"] }
serde_json = "1"
tempfile = "3"
